services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - BETS_FILE=/output/bets.csv
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - ./output:/output

  client_0:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_0
    depends_on:
      - server
    environment:
      - AGENCY_ID=0
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - INPUT_FILE_NAME=./input/input-0.csv
    volumes:
      - ./input:/input:ro
      - ./output:/output
